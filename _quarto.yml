project:
  type: website


# several branches can be specified here
branches:
  - branch: "release-2610"     # change this to the release branch
    output-dir: "2610"         # change this to year and month of the course instance

website:
  title: "ARISE2: Provision of Public Data Services"
  sidebar:
    style: "floating"
    background: "#F4F6F6"
    fontsize: 30px
    search: true
    contents: 
      - index.qmd 
      - material.qmd
      - authors.qmd
  navbar:
    background: "#32a852"
    text-color: white
    logo: "img/EMBL_logo_white_DIGITAL.svg"
  favicon: "img/EMBL_logo_white_DIGITAL.svg"
  body-footer: footer.html
  body-header: banner.html


format:
  html:
    theme: cosmo
    css: styles.css
    toc: true

execute:
  freeze: auto

